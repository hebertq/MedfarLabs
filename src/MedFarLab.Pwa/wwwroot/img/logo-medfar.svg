<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" /> <!-- Blue 500 -->
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" /> <!-- Cyan 500 -->
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Cross / Pulse Icon -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <rect x="35" y="10" width="30" height="80" rx="15" fill="url(#grad1)" />
    <rect x="10" y="35" width="80" height="30" rx="15" fill="url(#grad1)" />
    <path d="M 25 50 L 40 50 L 50 20 L 60 80 L 70 50 L 85 50" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Text -->
  <text x="120" y="70" font-family="'Inter', 'Roboto', sans-serif" font-weight="800" font-size="52" fill="#1e293b" letter-spacing="-1">
    MedFar<tspan fill="url(#grad1)">Labs</tspan>
  </text>
  
  <text x="124" y="95" font-family="'Inter', 'Roboto', sans-serif" font-weight="500" font-size="16" fill="#64748b" letter-spacing="2">
    CLINICAL PLATFORM
  </text>
</svg>
